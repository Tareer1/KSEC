name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Verify CLI boots
        run: |
          KSEC_HOME=/tmp/ksec-ci KSEC_CONFIG=/tmp/ksec-ci/config.toml \
            PYTHONPATH=src python3 -m ksec init --username admin --password 'ci-pass'
          KSEC_HOME=/tmp/ksec-ci KSEC_CONFIG=/tmp/ksec-ci/config.toml \
            PYTHONPATH=src python3 -m ksec status
          KSEC_HOME=/tmp/ksec-ci KSEC_CONFIG=/tmp/ksec-ci/config.toml \
            PYTHONPATH=src python3 -m ksec doctor