[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksec"
version = "0.2.0"
description = "KSEC — All-in-One Kali Linux Security Operations, Assessment, Research, Defense & Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KSEC Contributors" }]
keywords = ["security", "kali", "red-team", "blue-team", "osint", "dfir", "pentest"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# KSEC is intentionally AI-free and dependency-free at the core.
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
ksec = "ksec.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]